workflows:
  ios-workflow:
    name: PULSE - iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: PULSE-API

    environment:
      xcode: latest
      cocoapods: default

      groups:
        - apple_credentials
        - supabase_credentials

      vars:
        PACKAGE_ID: "com.olatz.fitnessapp"
        APP_VERSION: "1.0"
        BUILD_NUMBER: "3"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.olatz.fitnessapp"

    scripts:
      - name: Verificar variables de Supabase
        script: |
          set -e

          if [ -z "${VITE_SUPABASE_URL:-}" ]; then
            echo "ERROR: Falta VITE_SUPABASE_URL en el grupo supabase_credentials."
            exit 1
          fi

          if [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: Falta VITE_SUPABASE_ANON_KEY en el grupo supabase_credentials."
            exit 1
          fi

          echo "OK: Las variables de Supabase están configuradas."

      - name: Instalar dependencias
        script: |
          set -e
          npm ci

      - name: Construir aplicación web
        script: |
          set -e
          npm run build

          if [ ! -d "dist" ]; then
            echo "ERROR: No se ha generado la carpeta dist."
            exit 1
          fi

          if [ -z "$(find dist -maxdepth 1 -type f -name 'index.html' -print -quit)" ]; then
            echo "ERROR: No se encuentra dist/index.html."
            exit 1
          fi

          echo "OK: La aplicación web se ha construido."

      - name: Sincronizar Capacitor para iOS
        script: |
          set -e
          npx cap sync ios

      - name: Configurar firma de iOS
        script: |
          set -e
          xcode-project use-profiles

      - name: Establecer versión y número de compilación
        script: |
          set -e

          cd "$CM_BUILD_DIR/ios/App"

          xcrun agvtool new-marketing-version "$APP_VERSION"
          xcrun agvtool new-version -all "$BUILD_NUMBER"

          echo "=== VERSIONES CONFIGURADAS ==="
          xcrun agvtool what-marketing-version
          xcrun agvtool what-version

      - name: Verificar configuración de compilación
        script: |
          set -e

          xcodebuild \
            -project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            -scheme App \
            -showBuildSettings \
            | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION'

      - name: Generar IPA
        script: |
          set -e

          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

      - name: Verificar IPA generado
        script: |
          set -e

          IPA_PATH=$(find "$CM_BUILD_DIR/build/ios/ipa" -maxdepth 1 -type f -name "*.ipa" -print -quit)

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No se ha encontrado ningún archivo IPA."
            exit 1
          fi

          echo "IPA generado: $IPA_PATH"

          CHECK_DIR="$CM_BUILD_DIR/ipa-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"

          unzip -q "$IPA_PATH" -d "$CHECK_DIR"

          APP_PATH=$(find "$CHECK_DIR/Payload" -maxdepth 1 -type d -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se ha encontrado la aplicación dentro del IPA."
            exit 1
          fi

          APP_PLIST="$APP_PATH/Info.plist"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PLIST")

          echo "=== DATOS DEL IPA ==="
          echo "Bundle ID: $BUNDLE_ID"
          echo "Versión: $VERSION"
          echo "Build: $BUILD"

          if [ "$BUNDLE_ID" != "$PACKAGE_ID" ]; then
            echo "ERROR: El Bundle ID no coincide."
            exit 1
          fi

          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "ERROR: La versión no coincide."
            exit 1
          fi

          if [ "$BUILD" != "$BUILD_NUMBER" ]; then
            echo "ERROR: El número de compilación no coincide."
            exit 1
          fi

          echo "OK: El IPA tiene el identificador y las versiones esperados."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcode_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
