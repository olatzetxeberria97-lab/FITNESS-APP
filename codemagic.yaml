workflows:
  ios-workflow:
    name: Compilación automática de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_ID: "com.olatz.fitnessapp"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.olatz.fitnessapp
    scripts:
      - name: Instalar dependencias y construir web
        script: |
          npm install
          npm run build
      - name: Sincronizar Capacitor iOS
        script: |
          npx cap sync ios
