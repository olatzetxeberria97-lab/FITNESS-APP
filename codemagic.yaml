workflows:
  ios-workflow:
    name: PULSE - Compilación automática de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: PULSE-API

    environment:
      groups:
        - apple_credentials
        - supabase_credentials
      vars:
        PACKAGE_ID: "com.olatz.fitnessapp"
        APP_VERSION: "1.0"
        BUILD_NUMBER: "3"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.olatz.fitnessapp"

    scripts:
      - name: Instalar dependencias
        script: |
          set -e
          echo "=== VERSIONES DEL ENTORNO ==="
          node --version
          npm --version
          echo "=== INSTALANDO DEPENDENCIAS ==="
          npm ci

      - name: Verificar variables de Supabase
        script: |
          set -e

          if [ -z "${VITE_SUPABASE_URL:-}" ]; then
            echo "ERROR: Falta VITE_SUPABASE_URL."
            exit 1
          fi

          if [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: Falta VITE_SUPABASE_ANON_KEY."
            exit 1
          fi

          echo "OK: Variables de Supabase presentes."

      - name: Diagnosticar autenticación y dependencias
        script: |
          set -e

          echo "=== COMMIT ==="
          git rev-parse HEAD || true

          echo "=== ARCHIVOS DE AUTENTICACIÓN ==="
          for FILE in \
            src/lib/auth.tsx \
            src/lib/supabase.ts \
            src/components/Onboarding.tsx
          do
            if [ -f "$FILE" ]; then
              echo "ENCONTRADO: $FILE"
            else
              echo "NO ENCONTRADO: $FILE"
            fi
          done

          echo "=== REFERENCIAS A useAuth ==="
          grep -R -n --include='*.ts' --include='*.tsx' \
            'useAuth' src || true

          echo "=== DEPENDENCIAS PRINCIPALES ==="
          npm ls react react-dom vite @vitejs/plugin-react typescript --depth=0 || true

      - name: Construir aplicación web
        script: |
          set -e
          echo "=== CONSTRUYENDO PULSE ==="
          npm run build

          if [ ! -d "dist" ]; then
            echo "ERROR: No se ha generado la carpeta dist."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: No se ha generado dist/index.html."
            exit 1
          fi

          echo "OK: Aplicación web generada."

      - name: Sincronizar Capacitor iOS
        script: |
          set -e
          npx cap sync ios

      - name: Configurar firma de iOS
        script: |
          set -e
          xcode-project use-profiles

      - name: Establecer versión iOS
        script: |
          set -e

          cd "$CM_BUILD_DIR/ios/App"

          xcrun agvtool new-marketing-version "$APP_VERSION"
          xcrun agvtool new-version -all "$BUILD_NUMBER"

          echo "=== VERSIONES CONFIGURADAS ==="
          xcrun agvtool what-marketing-version
          xcrun agvtool what-version

      - name: Crear IPA
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          xcode-project build-ipa
          ```yaml
            --project ios/App/App.xcodeproj \
            --scheme App

      - name: Verificar IPA generado
        script: |
          set -e

          echo "=== BUSCANDO IPA ==="
          IPA_PATH=$(find "$CM_BUILD_DIR/build/ios/ipa" -name "*.ipa" -print -quit)

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No se ha generado ningún IPA."
            exit 1
          fi

          echo "IPA generado: $IPA_PATH"

          CHECK_DIR="/tmp/pulse_ipa_check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"

          unzip -q "$IPA_PATH" -d "$CHECK_DIR"

          APP_PATH=$(find "$CHECK_DIR/Payload" -maxdepth 1 -type d -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encuentra la aplicación dentro del IPA."
            exit 1
          fi

          APP_PLIST="$APP_PATH/Info.plist"

          VERSION=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" "$APP_PLIST")

          BUILD=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" "$APP_PLIST")

          BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" "$APP_PLIST")

          echo "=== DATOS DE LA APLICACIÓN ==="
          echo "Versión: $VERSION"
          echo "Build: $BUILD"
          echo "Bundle ID: $BUNDLE_ID"

          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "ERROR: La versión del IPA no coincide."
            exit 1
          fi

          if [ "$BUILD" != "$BUILD_NUMBER" ]; then
            echo "ERROR: El número de compilación del IPA no coincide."
            exit 1
          fi

          if [ "$BUNDLE_ID" != "$PACKAGE_ID" ]; then
            echo "ERROR: El identificador de la aplicación no coincide."
            exit 1
          fi

          echo "OK: Verificación del IPA completada."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcode_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
