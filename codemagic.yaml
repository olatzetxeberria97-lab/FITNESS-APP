workflows:
  ios-build-and-archive:
    name: Compilación y archivo de iOS
    max_build_duration: 60
    instance: mac_mini_m2
    environment:
      groups:
        - apple_credentials
      vars:
        BUNDLE_ID: "com.olatz.fitnessapp"
      cocoapods: default
    scripts:
      - name: Instalar dependencias de npm
        script: |
          npm ci
      - name: Sincronizar Capacitor y plataformas
        script: |
          npx cap sync ios
      - name: Construir aplicación web
        script: |
          npm run build
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_beta_builds_before_publishing: false
