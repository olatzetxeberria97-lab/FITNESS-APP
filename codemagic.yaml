workflows:
  ios-workflow:
    name: Compilación y archivo de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - apple_credentials
      vars:
        BUNDLE_ID: "com.olatz.fitnessapp"
      cocoapods: default
    scripts:
      - name: Instalar dependencias de npm
        script: |
          npm ci
      - name: Añadir plataforma iOS
        script: |
          npx cap add ios || true
      - name: Sincronizar Capacitor y plataformas
        script: |
          npx cap sync ios
      - name: Construir aplicación web
        script: |
          npm run build
      - name: Construir IPA para iOS
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/Default/*.ipa
