workflows:
  ios-workflow:
    name: Compilación automática de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_ID: "PULSE - fitness-community-we-6snd.bolt.host"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "PULSE - fitness-community-we-6snd.bolt.host"
    scripts:
      - name: Instalar dependencias y construir web
        script: |
          npm install
          npm run build
      - name: Sincronizar Capacitor iOS
        script: |
          npx cap sync ios
    publishing:
      app_store_connect:
        # Al tener la clave ya vinculada en el panel web de Codemagic (Developer Portal),
        # omitimos el bloque 'auth: integration' que causa conflictos de esquema y dejamos
        # que Codemagic enlace la app por defecto con el Bundle ID.
        submit_to_testflight: true
