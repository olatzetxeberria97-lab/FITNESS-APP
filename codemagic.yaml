workflows:
  ios-workflow:
    name: Compilación automática de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_ID: "com.olatz.fitnessapp"
      ios_signing:
        provisioning_profiles:
          - "Tienda de aplicaciones de fitness"
    scripts:
      - name: Instalar dependencias y construir web
        script: |
          npm install
          npm run build
      - name: Sincronizar Capacitor iOS
        script: |
          npx cap sync ios
