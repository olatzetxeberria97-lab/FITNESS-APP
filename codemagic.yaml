workflows:
  ios-workflow:
    name: Compilación de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.olatz.fitnessapp"
    scripts:
      - name: Instalar dependencias y compilar web
        script: |
              npm install
              npm run build || true
      - name: Sincronizar Capacitor iOS
        script: |
              npx cap add ios || true
              npx cap sync ios
      - name: Configurar versión
        script: |
              VERSION=$(node -p "require('./package.json').version")
              BUILD_NUMBER=$(date +%Y%m%d%H%M)
              echo "Configuring Version: $VERSION"
              cd ios/App
              agvtool new-marketing-version "$VERSION"
              agvtool new-version -all "$BUILD_NUMBER"
      - name: Compilar aplicación iOS
        script: |
              xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -derivedDataPath derived_data build
    artifacts:
      - ios/App/derived_data/Build/Products/Release-iphoneos/*.app
      - build/ios/ipa/*.ipa
