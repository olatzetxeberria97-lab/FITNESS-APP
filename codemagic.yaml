workflows:
  ios-workflow:
    name: Compilación automática de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_ID: "com.olatz.fitnessapp"
        APP_STORE_CONNECT_ISSUER_ID: "94a5c1a0-472e-4f2e-9263-4ca98da54e9d"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "9NLX79YHJ5"
    scripts:
      - name: Instalar dependencias web
        script: |
          npm install
      - name: Construir la aplicación web
        script: |
          npm run build
      - name: Sincronizar plataforma iOS
        script: |
          npx cap sync ios
    publishing:
      app_store_connect:
        auth: api_key
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        key: $APP_STORE_CONNECT_PRIVATE_KEY
        submit_to_testflight: true
