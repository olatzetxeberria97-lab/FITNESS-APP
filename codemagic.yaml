workflows:
  ios-workflow:
    name: Compilación automática de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_ID: "com.olatz.fitnessapp"
    integrations:
      app_store_connect: Codemagic
    scripts:
      - name: Instalar dependencias web
        script: |
          npm install
      - name: Construir la aplicación web
        script: |
          npm run build
      - name: Sincronizar plataforma iOS
        script: |
          npx cap sync ios
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
