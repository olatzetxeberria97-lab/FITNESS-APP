workflows:
  ios-workflow:
    name: Compilación y archivo de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - apple_credentials
      vars:
        BUNDLE_ID: "com.olatz.fitnessapp"
      cocoapods: default
    scripts:
      - name: Instalar dependencias y compilar web
        script: |
          npm ci
          npm run build
    pkg:
      capacitor:
        app_directory: "."
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/Default/*.ipa
