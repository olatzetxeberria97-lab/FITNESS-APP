workflows:
  ios-workflow:
    name: Compilación automática de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: PULSE-API

    environment:
      vars:
        PACKAGE_ID: "com.olatz.fitnessapp"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.olatz.fitnessapp"

    scripts:
      - name: Instalar dependencias y construir web
        script: |
          npm install
          npm run build

      - name: Sincronizar Capacitor iOS
        script: |
          npx cap sync ios

      - name: Configurar firma de iOS
        script: |
          xcode-project use-profiles

      - name: Comprobar exportOptions
        script: |
          echo "Buscando exportOptions.plist..."
          find . -name "exportOptions.plist" -print

      - name: Crear Archive
        script: |
          mkdir -p build/ios/xcarchive

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM=D2R496B234 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual

      - name: Crear IPA
        script: |
          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/ios/App/exportOptions.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcode_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
