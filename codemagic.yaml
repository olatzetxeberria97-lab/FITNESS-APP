workflows:
  ios-workflow:
    name: Compilación automática de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_ID: "com.olatz.fitnessapp"
    integrations:
      app_store_connect: AppStoreConnect
    scripts:
      - name: Instalar dependencias web
        script: |
          npm install
      - name: Construir la aplicación web
        script: |
          npm run build
      - name: Sincronizar plataforma iOS
        script: |
          npx cap sync ios
    publishing:
      app_store_connect:
        auth: integration
        key_id: "9NLX79YHJ5"
        issuer_id: "94a5c1a0-472e-4f2e-9263-4ca98da54e9d"
        submit_to_testflight: true
