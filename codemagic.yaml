workflows:
  ios-workflow:
    name: Compilación automática de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: PULSE-API

    environment:
      vars:
        PACKAGE_ID: "com.olatz.fitnessapp"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.olatz.fitnessapp"

    scripts:
      - name: Instalar dependencias y construir web
        script: |
          npm install
          npm run build

      - name: Sincronizar Capacitor iOS
        script: |
          npx cap sync ios

      - name: Comprobar proyecto iOS
        script: |
          echo "======================================"
          echo "      COMPROBANDO PROYECTO IOS"
          echo "======================================"

          echo ""
          echo "Contenido de la carpeta ios:"
          ls -la ios || true

          echo ""
          echo "Buscando proyectos Xcode:"
          find ios -type f \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) -print

          echo ""
          echo "Workspaces encontrados:"
          find ios -type d -name "*.xcworkspace" -print

          echo ""
          echo "Proyectos encontrados:"
          find ios -type d -name "*.xcodeproj" -print

          echo ""
          echo "======================================"
          echo "      FIN DE LA COMPROBACION"
          echo "======================================"

      - name: Configurar firma de iOS
        script: |
          xcode-project use-profiles

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
