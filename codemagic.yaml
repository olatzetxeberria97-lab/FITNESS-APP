workflows:
  ios-workflow:
    name: Compilación automática de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_ID: "com.olatz.fitnessapp"
      # Aquí enlazas el grupo de variables o la integración de Apple que conectamos antes
      groups:
        - appstore_credentials 
    scripts:
      - name: Instalar dependencias web
        script: |
          npm install
      - name: Construir la aplicación web
        script: |
          npm run build
      - name: Sincronizar plataforma iOS
        script: |
          npx cap sync ios
    publishing:
      app_store_connect:
        auth: integration # Utiliza la integración automática del Developer Portal que ya tienes conectada
        submit_to_testflight: true # Sube la app automáticamente a TestFlight
