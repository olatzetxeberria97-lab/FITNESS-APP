workflows:
  ios-workflow:
    name: Compilación automática de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: PULSE-API

    environment:
      groups:
        - apple_credentials
        - supabase_credentials

      vars:
        PACKAGE_ID: "com.olatz.fitnessapp"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.olatz.fitnessapp"

      scripts:
      - name: Diagnostico de compilacion
        script: |
          set -e
          echo "========== DIAGNOSTICO PULSE =========="
          echo "Directorio del proyecto:"
          pwd
          echo "Commit:"
          if git rev-parse HEAD 2>/dev/null; then
            echo "Repositorio Git disponible."
          else
            echo "No hay repositorio Git disponible en este entorno."
          fi

          for FILE in \
            src/lib/auth.tsx \
            src/lib/supabase.ts \
            src/lib/auth.ts \
            src/lib/auth.js \
            src/components/Onboarding.tsx \
            vite.config.ts
          do
            if [ -f "$FILE" ]; then
              echo "EXISTE: $FILE"
            else
              echo "NO EXISTE: $FILE"
            fi
          done

          if [ -f src/lib/auth.tsx ]; then
            echo "========== FINAL auth.tsx =========="
            tail -n 15 src/lib/auth.tsx
          fi

          if [ -f src/components/Onboarding.tsx ]; then
            echo "========== INICIO Onboarding.tsx =========="
            head -n 8 src/components/Onboarding.tsx
          fi

          if [ -f vite.config.ts ]; then
            echo "========== vite.config.ts =========="
            cat vite.config.ts
          fi

     workflows:
  ios-workflow:
    name: Compilación automática de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: PULSE-API

    environment:
      groups:
        - apple_credentials
        - supabase_credentials

      vars:
        PACKAGE_ID: "com.olatz.fitnessapp"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.olatz.fitnessapp"

    scripts:
      - name: Instalar dependencias y construir web
        script: |
          set -e
          npm install
          npm run build

      - name: Verificar variables de Supabase
        script: |
          set -e

          if [ -z "${VITE_SUPABASE_URL:-}" ]; then
            echo "ERROR: Falta VITE_SUPABASE_URL en el grupo de variables."
            exit 1
          fi

          if [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: Falta VITE_SUPABASE_ANON_KEY en el grupo de variables."
            exit 1
          fi

          echo "OK: Las variables de Supabase están configuradas."

      - name: Sincronizar Capacitor iOS
        script: |
          set -e
          npx cap sync ios

      - name: Configurar firma de iOS
        script: |
          set -e
          xcode-project use-profiles

      - name: Establecer versión iOS
        script: |
          set -e

          APP_VERSION="1.0"
          BUILD_NUMBER="3"

          echo "======================================"
          echo "Configurando versión iOS"
          echo "APP_VERSION=$APP_VERSION"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          echo "======================================"

          cd "$CM_BUILD_DIR/ios/App"

          xcrun agvtool new-marketing-version "$APP_VERSION"
          xcrun agvtool new-version -all "$BUILD_NUMBER"

          echo "=== VERIFICACIÓN DE VERSIÓN ==="
          xcrun agvtool what-marketing-version
          xcrun agvtool what-version

      - name: Verificar configuración de compilación
        script: |
          set -e

          echo "=== BUILD SETTINGS ==="

          cd "$CM_BUILD_DIR"

          xcodebuild \
            -project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            -scheme App \
            -showBuildSettings \
            | grep -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION'

      - name: Crear IPA
        script: |
          set -e

          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

      - name: Verificar IPA generado
        script: |
          set -e

          echo "=== VERIFICANDO IPA REAL ==="

          IPA_PATH=$(find "$CM_BUILD_DIR/build/ios/ipa" -name "*.ipa" -print -quit)

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No se encontró el IPA."
            exit 1
          fi

          echo "IPA: $IPA_PATH"

          rm -rf /tmp/pulse_ipa_check
          mkdir -p /tmp/pulse_ipa_check

          unzip -q "$IPA_PATH" -d /tmp/pulse_ipa_check

          echo "=== BUSCANDO APP DENTRO DEL IPA ==="

          APP_PATH=$(find /tmp/pulse_ipa_check/Payload -maxdepth 1 -type d -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró ninguna aplicación .app dentro del IPA."
            ls -la /tmp/pulse_ipa_check/Payload
            exit 1
          fi

          echo "APP: $APP_PATH"

          APP_PLIST="$APP_PATH/Info.plist"

          if [ ! -f "$APP_PLIST" ]; then
            echo "ERROR: No se encontró Info.plist."
            exit 1
          fi

          echo "=== COMPROBANDO VERSIONES ==="

          VERSION=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP_PLIST")

          BUILD=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP_PLIST")

          echo "======================================"
          echo "CFBundleShortVersionString = $VERSION"
          echo "CFBundleVersion = $BUILD"
          echo "======================================"

          if [ "$VERSION" != "1.0" ]; then
            echo "ERROR: La versión debe ser 1.0."
            exit 1
          fi

          if [ "$BUILD" != "3" ]; then
            echo "ERROR: El build debe ser 3."
            exit 1
          fi

          echo "OK: IPA contiene versión 1.0 (3)."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcode_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

      - name: Verificar variables de Supabase
