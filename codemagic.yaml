workflows:
  ios-workflow:
    name: Compilación automática de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_ID: "com.olatz.fitnessapp"
        APP_STORE_CONNECT_ISSUER_ID: "94a5c1a0-472e-4f2e-9263-4ca98da54e9d"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "3U2J699AXT"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgvZz+//Z7qRS+z3nw
          bL7F7ShHzYwEKsfQhKtBGmXNbV6gCgYIKoZIzj0DAQehRANCAAQxIZMrhiKnKftT
          kHqvl66EaoJ2IkK1Y6TWQKu7QTlaoULQ9DAiatN6n6PseG+V+YVJM7ueWfiX5c7b
          0x++znPX
          -----END PRIVATE KEY-----
    scripts:
      - name: Instalar dependencias web
        script: |
          npm install
      - name: Construir la aplicación web
        script: |
          npm run build
      - name: Sincronizar plataforma iOS
        script: |
          npx cap sync ios
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
