workflows:
  ios-workflow:
    name: Compilación automática de iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_ID: "PULSE - fitness-community-we-6snd.bolt.host"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "PULSE - fitness-community-we-6snd.bolt.host"
    scripts:
      - name: Instalar dependencias y construir web
        script: |
          npm install
          npm run build
      - name: Sincronizar Capacitor iOS
        script: |
          npx cap sync ios
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
